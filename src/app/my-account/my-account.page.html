<ion-content class="account-content">
  <ion-item lines="none">
    <ion-menu-button class="menu-btn" slot="start">
      <ion-icon src="assets/icon/menu.svg"></ion-icon>
    </ion-menu-button>
    <ion-searchbar name="search" placeholder="search">
    </ion-searchbar>
    <ion-button shape="round" slot="end" routerLink="/cart" routerDirection="forward">
      <ion-badge class="home-badge">
        0
      </ion-badge>
      <ion-icon src="assets/icon/shopping-cart.svg"></ion-icon>
    </ion-button>
  </ion-item>
  <ion-item lines="none" class="item-back">
    <ion-icon slot="start" routerLink="/home" routerDirection="back" src="assets/icon/back.svg">
    </ion-icon>
    <p>My Account</p>
  </ion-item>
  <ion-card class="card-header animated fadeIn">
    <ion-thumbnail>
      <ion-img src="assets/images/other/category-header-uno.png">
      </ion-img>
    </ion-thumbnail>
  </ion-card>
  <ion-card class="card-username">
    <ion-item lines="none" *ngIf="visProfileItem">
      <ion-avatar slot="start">
        <ion-img src="assets/images/other/face-images/4.png"></ion-img>
      </ion-avatar>
      <ion-label>
        <p>
          Your Name Here
        </p>
        <ion-button fill="clear">
          <ion-icon src="assets/icon/logout.svg"></ion-icon>
          Logout
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-card>
  <ion-card class="card-bono" *ngIf="visProfileItem && bonoCode">
    <ion-item lines="none" class="bono-code-item" button (click)="copyBonoCode()">
      <ion-icon src="assets/icon/reward-points.svg" slot="start"></ion-icon>
      <ion-label>
        <p class="bono-code-label">Tu bono personal</p>
        <h2 class="bono-code-value">{{ bonoCode }}</h2>
      </ion-label>
      <ion-button slot="end" fill="clear" (click)="$event.stopPropagation(); copyBonoCode()">
        <ion-icon name="copy-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
    <p class="bono-code-hint">Toca para copiar. Aplica solo a productos adicionales que agregues a un pedido, no al que estés comprando en ese momento.</p>
  </ion-card>
  <ion-list class="list">
    <div *ngFor="let item of listInputItems">
      <ion-item class="animated fadeInRight" lines="none">
        <ion-input placeholder="{{item.placeHolder}}" type="{{item.type}}"></ion-input>
      </ion-item>
    </div>
  </ion-list>
  <div class="update-div">
    <ion-button class="update-btn" (click)="updateProfile()">
      Update
    </ion-button>
  </div>
  <div class="delete-account-div" *ngIf="visProfileItem">
    <ion-button expand="block" fill="clear" color="danger" [disabled]="isDeletingAccount" (click)="confirmDeleteAccount()">
      <ion-icon name="trash-outline" slot="start"></ion-icon>
      Eliminar cuenta
    </ion-button>
  </div>
</ion-content>
