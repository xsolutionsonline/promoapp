<ion-content class="intro-content" scroll-y="false" >
  <div class="main-container">
    <div class="horizontal-scroll-container" #scrollContainer (scroll)="onScroll($event)">
      <div class="scroll-item" *ngFor="let slide of sliderItems">
        <div class="slide-content">
          <div class="image-container">
            <ion-img [src]="slide.img" class="main-img"></ion-img>
            <div class="upper-div">
              <ion-img [src]="slide.curve"></ion-img>
            </div>
          </div>
          <div class="text-content">
            <h3>{{slide.title}}</h3>
            <p>{{slide.desc}}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination dots (optional visual indicator) -->
    <div class="pagination-dots">
      <!-- You would need to implement logic to highlight the active dot based on currentIndex -->
    </div>

    <div class="footer-buttons">
      <div class="btn-div">
        <ion-button (click)="nextSlide()" class="btn-next" *ngIf="visBtn">
          Next
        </ion-button>
        <ion-button routerLink="/home" routerDirection="forward" class="btn-next" *ngIf="!visBtn">
          Done
        </ion-button>
      </div>
      <div class="btn-div">
        <ion-button routerLink="/home" routerDirection="forward" fill="clear" class="btn-skip" *ngIf="visBtn">
          <u>Skip</u>
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
