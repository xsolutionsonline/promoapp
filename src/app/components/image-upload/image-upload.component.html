<div class="image-upload-container">
  <input type="file" #fileInput multiple (change)="uploadFile($event)" accept="image/*" style="display: none;" />

  <div class="upload-btn-wrapper" (click)="fileInput.click()">
    <ion-icon name="camera-outline"></ion-icon>
    <ion-label>Agregar Imágenes</ion-label>
  </div>

  <div *ngIf="isUploading" class="progress-bar-container">
    <ion-progress-bar [value]="uploadPercent / 100"></ion-progress-bar>
  </div>
</div>
