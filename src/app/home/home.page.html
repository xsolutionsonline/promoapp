<ion-content class="home-content">
  <div [style.filter]="divBlur">

    <!-- Hero header: gradient, glass controls, search + category picker -->
    <div class="home-hero">
      <div class="home-hero-topbar">
        <ion-menu-button class="glass-btn menu-btn">
          <ion-icon src="assets/icon/menu.svg"></ion-icon>
        </ion-menu-button>

        <div class="home-hero-brand">
          <span class="eyebrow">Bienvenido</span>
          <h1>Descubre tu próxima compra</h1>
        </div>

        <!-- Web: sit inline, right after the brand text. Mobile: wrap to their own rows below. -->
        <div class="home-searchbar">
          <ion-icon name="search-outline"></ion-icon>
          <ion-searchbar name="search" placeholder="¿Qué estás buscando hoy?" mode="ios"></ion-searchbar>
        </div>

      </div>
    </div>

    <!-- "Pago contra entrega" banner, right after the header -->
    <div class="home-banner">
      <img src="assets/images/banner/banner-1.png" alt="Paga al recibir" />
    </div>

    <!-- Compact category picker: first -->
    <div class="category-select-compact" *ngIf="categoryItems && categoryItems.length > 0">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-select interface="popover" placeholder="Explorar por categoría"
        (ionChange)="goToShop($event.detail.value)">
        <ion-select-option *ngFor="let item of categoryItems" [value]="item">{{item.text}}</ion-select-option>
      </ion-select>
    </div>

    <ng-container *ngTemplateOutlet="productSection; context: { title: 'Ofertas del día', items: saleItems, icon: '🔥', ribbonText: 'Oferta', ribbonClass: 'ribbon-oferta' }"></ng-container>
    <ng-container *ngTemplateOutlet="productSection; context: { title: 'Nuevos productos', items: newItems, icon: '✨', ribbonText: 'Nuevo', ribbonClass: 'ribbon-nuevo' }"></ng-container>
    <ng-container *ngTemplateOutlet="productSection; context: { title: 'Destacados', items: featuredItems, icon: '🌟', ribbonText: 'Destacado', ribbonClass: 'ribbon-destacado' }"></ng-container>

    <ng-template #productSection let-title="title" let-items="items" let-icon="icon" let-ribbonText="ribbonText" let-ribbonClass="ribbonClass">
      <ng-container *ngIf="items && items.length > 0">
        <div class="section-heading">
          <span class="section-icon">{{icon}}</span>
          <h2>{{title}}</h2>
          <span class="section-count">{{items.length}}</span>
        </div>
        <div class="horizontal-scroll-container" #scrollContainer>
          <div class="product-card" *ngFor="let item of items" (click)="goToProductDetail(item)">
            <div class="product-media">
              <img [src]="item.img" [alt]="item.text" />

              <!-- Only the ribbon for the section this card is actually shown in —
                   a product may be featured+new+sale at once, but it's only
                   displayed here, so it only wears this one ribbon. -->
              <span class="ribbon" [ngClass]="ribbonClass">{{ribbonText}}</span>

              <button class="wishlist-btn" (click)="heart(item); $event.stopPropagation()">
                <ion-icon [name]="item.heartVis ? 'heart' : 'heart-outline'" [class.heart-filled]="item.heartVis"></ion-icon>
              </button>
            </div>

            <div class="product-info">
              <p class="product-title">{{item.text}}</p>
              <div class="product-price-row">
                <span class="price-now">${{item.price}}</span>
                <span class="price-was" *ngIf="item.dPrice && item.dPrice !== item.price">${{item.dPrice}}</span>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </ng-template>

  </div>

  <!-- Web only: "pago contra entrega" banner as a popup, shown every time the
       user enters the home page. On mobile this stays inline (see above). -->
  <ion-modal class="banner-popup-modal" [isOpen]="isBannerPopupOpen" (didDismiss)="closeBannerPopup()">
    <ng-template>
      <div class="banner-popup">
        <img src="assets/images/banner/banner-1.png" alt="Paga al recibir" />
        <ion-button expand="block" class="banner-popup-btn" (click)="closeBannerPopup()">
          🎉 ¡Sí, quiero comprar así! Ver la tienda
        </ion-button>
      </div>
    </ng-template>
  </ion-modal>
</ion-content>
