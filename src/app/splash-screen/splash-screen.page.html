<ion-content class="splash-content ion-no-padding">
  <div class="video-container" [style.opacity]="isVideoLoaded ? '1' : '0'">
    <video #splashVideo autoplay muted playsinline loop class="splash-video">
      <source src="assets/videos/splash.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
</ion-content>
